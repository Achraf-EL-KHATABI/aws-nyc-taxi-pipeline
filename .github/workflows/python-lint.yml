name: Python Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/python-lint.yml'

jobs:
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: Run ruff check
        run: ruff check scripts/ glue_jobs/

      - name: Run ruff format check
        run: ruff format --check scripts/ glue_jobs/